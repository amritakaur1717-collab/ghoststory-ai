<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostStory AI 👻</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>👻 GhostStory AI</h1>
        <p>Your imagination. Your nightmare.</p>

        <textarea id="prompt" placeholder="Describe the spooky story you want..."></textarea>

        <select id="mood">
            <option value="Spooky">Spooky 👻</option>
            <option value="Mysterious">Mysterious 🌙</option>
            <option value="Supernatural">Supernatural 🔮</option>
        </select>

        <button id="generate">Create My Story</button>

        <div id="result">Your story will appear here...</div>
    </main>

    <script src="script.js"></script>
</body>

</html>
